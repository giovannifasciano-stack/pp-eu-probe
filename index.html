<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Test uscita europea</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#221710;--card:#362619;--line:#4d3826;--gold:#b08d57;--gold2:#d8bc8a;--txt:#f0e8da;--dim:#a89680}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px;background:var(--bg);color:var(--txt);font-family:Outfit,sans-serif}
.wrap{max-width:560px;margin:0 auto}
h1{font-weight:300;font-size:22px;margin:0 0 4px}
.sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:22px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:'DM Mono',monospace;font-size:12px}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#221710;font-family:Outfit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.res{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.big{font-family:'DM Mono',monospace;font-size:26px;color:var(--gold2);margin:6px 0}
.lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.row{margin-bottom:12px}
.verdict{margin-top:14px;padding:12px;border-radius:9px;font-size:14px;line-height:1.45}
.good{background:rgba(143,181,115,.14);border:1px solid #8fb573;color:#c9e0b8}
.bad{background:rgba(201,106,94,.14);border:1px solid #c96a5e;color:#e8b6b0}
pre{font-family:'DM Mono',monospace;font-size:10px;color:var(--dim);white-space:pre-wrap;word-break:break-all;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test uscita europea</h1>
  <div class="sub">verifica quale valuta serve patek.com a un server in Germania</div>

  <input id="u" value="https://www.patek.com/en/collection/nautilus/5811-1g-001">
  <button id="go">Interroga patek.com</button>

  <div class="res" id="res" style="display:none"></div>
</div>

<script>
const btn = document.getElementById('go');
const res = document.getElementById('res');

btn.onclick = async () => {
  btn.disabled = true;
  btn.textContent = 'lettura in corso…';
  res.style.display = 'block';
  res.innerHTML = '<div class="lbl">attendere</div>';
  try{
    const r = await fetch('/api/price?u=' + encodeURIComponent(document.getElementById('u').value));
    const d = await r.json();
    let h = '';
    if(d.uscita){
      h += '<div class="row"><div class="lbl">il server esce da</div><div class="big" style="font-size:18px">' +
           (d.uscita.paese || '?') + (d.uscita.citta ? ' · ' + d.uscita.citta : '') + '</div></div>';
    }
    if(d.ok){
      h += '<div class="row"><div class="lbl">valuta ricevuta</div><div class="big">' + d.valuta + ' ' + d.prezzo.toLocaleString('it-IT') + '</div></div>';
      h += d.valuta === 'EUR'
        ? '<div class="verdict good">Funziona. patek.com serve il listino in euro a questa uscita: possiamo cablare il listino EUR nel catalogo.</div>'
        : '<div class="verdict bad">Risponde in ' + d.valuta + ', non in euro. Questa strada non porta al listino europeo.</div>';
    }else{
      h += '<div class="verdict bad">Nessun prezzo letto. ' + (d.errore || '') + '</div>';
    }
    h += '<pre>' + JSON.stringify(d, null, 1) + '</pre>';
    res.innerHTML = h;
  }catch(e){
    res.innerHTML = '<div class="verdict bad">Errore: ' + e.message + '</div>';
  }
  btn.disabled = false;
  btn.textContent = 'Interroga patek.com';
};
</script>
</body>
</html>
